name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch. A push supersedes the run before it, which is what should have
# been cancelling the stale runs rather than someone doing it by hand.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI while leaving local builds quiet.
  RUSTFLAGS: -D warnings

jobs:
  # The job this repository actually needs. macOS and Windows support exists in the
  # platform abstractions but has never been built or run, so until this passes,
  # cross-platform support is a claim rather than a fact.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platforms when one fails: the interesting question
      # is which platforms break, not that any did.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Linux needs the windowing, font and audio headers that winit, fontdb and
      # wgpu link against. macOS and Windows get theirs from the SDK.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libfontconfig-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Build
        run: cargo build --workspace --all-targets

      # Tests that need a font are skipped rather than failed on a runner without
      # one; the font-dependent suites say so in their panic message.
      - name: Install a font for the font tests
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Test
        # The GPU tests skip themselves when no adapter is available, which is the
        # normal case on a headless runner. Everything else must pass.
        run: cargo test --workspace --features tuz-core/test-util

  lint:
    name: clippy and rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libfontconfig-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

  # A terminal that renders text is a poor place for an unaudited dependency, and
  # the tree pulls in a GPU stack, a VT parser and two plugin runtimes.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # The action publishes its findings as a check run, which the default read-only
    # token cannot create — it failed with "Resource not accessible by integration",
    # which reads like a vulnerability was found and is actually a permissions error.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        # Advisories are reported, and only real vulnerabilities stop the build.
        # `rustybuzz` and `ttf-parser` are both flagged unmaintained upstream, with
        # `harfrust` and `skrifa` as successors — a migration worth doing and not a
        # reason to paint every commit red until it happens. `cargo audit` finds
        # zero actual vulnerabilities today.
        continue-on-error: true

      - name: Fail only on vulnerabilities
        run: |
          cargo install cargo-audit --locked
          # `--deny warnings` is deliberately absent: informational advisories are
          # visible in the step above without gating the build.
          cargo audit --quiet
