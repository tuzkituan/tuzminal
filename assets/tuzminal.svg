<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64">
  <!-- Generated from GRID in crates/tuzminal/src/appicon.rs. The tile is a normally
       rounded rectangle; only the glyphs on it are pixel art, which is why
       `shape-rendering` is set on the group holding them and not on the tile —
       the corner wants antialiasing and the glyphs do not. A test in appicon.rs
       asserts this file and that grid agree. -->
  <rect x="0" y="0" width="16" height="16" rx="3.36" fill="#141720"/>
  <g shape-rendering="crispEdges">
    <rect x="3" y="5" width="2" height="1" fill="#5cf0d4"/>
    <rect x="4" y="6" width="2" height="1" fill="#5cf0d4"/>
    <rect x="10" y="6" width="3" height="1" fill="#e6e9f0"/>
    <rect x="5" y="7" width="2" height="1" fill="#5cf0d4"/>
    <rect x="10" y="7" width="3" height="1" fill="#e6e9f0"/>
    <rect x="5" y="8" width="2" height="1" fill="#5cf0d4"/>
    <rect x="10" y="8" width="3" height="1" fill="#e6e9f0"/>
    <rect x="4" y="9" width="2" height="1" fill="#5cf0d4"/>
    <rect x="10" y="9" width="3" height="1" fill="#e6e9f0"/>
    <rect x="3" y="10" width="2" height="1" fill="#5cf0d4"/>
    <rect x="10" y="10" width="3" height="1" fill="#e6e9f0"/>
  </g>
</svg>
