[package]
name = "tuzminal"
description = "A fast, modular, GPU-accelerated terminal emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "tuzminal"

# --- native packages -------------------------------------------------------
#
# Both builders read `target/release/tuzminal`, which `scripts/package.sh` strips
# first: the release profile keeps debug symbols on purpose, and they are the
# difference between a 25 MB binary and a 167 MB one.
#
# The desktop entry installed here uses a bare `Exec=tuzminal`, which is correct for
# a system package: /usr/bin is on every session's PATH. The app's own
# `--install-desktop-entry` writes an absolute path instead, because ~/.cargo/bin
# usually is not.

[package.metadata.deb]
maintainer = "Tuz <lewis.nguyen@terralogic.com>"
copyright = "Tuz"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
A fast, modular, GPU-accelerated terminal emulator with tabs, split panes, a file \
explorer, installable themes, and a plugin system that runs both Lua and \
WebAssembly."""
section = "utils"
priority = "optional"
# Listed by hand, not `$auto`. Every windowing library here is `dlopen`ed by winit
# and wgpu at runtime rather than linked, so the binary's ELF header names only
# libc, libm and libgcc — `dpkg-shlibdeps` and `auto-req` both find nothing to
# depend on, and the package would install happily onto a system it cannot run on.
#
# Vulkan is a recommendation rather than a requirement: there is a working GL
# backend, and `performance.gpu_backend = "gl"` is what the error message suggests.
depends = "libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libegl1, libdbus-1-3, fontconfig-config"
recommends = "libvulkan1"
assets = [
    ["../../target/release/tuzminal", "usr/bin/", "755"],
    ["../../assets/tuzminal.desktop", "usr/share/applications/", "644"],
    ["../../assets/tuzminal.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/tuzminal/", "644"],
    ["../../docs/PLUGINS.md", "usr/share/doc/tuzminal/", "644"],
    ["../../plugins/**/*", "usr/share/doc/tuzminal/plugins/", "644"],
]

[package.metadata.generate-rpm]
summary = "A fast, modular, GPU-accelerated terminal emulator"
# See the note on `depends` above: these are dlopened, so nothing can infer them.
auto-req = "no"
requires = { libwayland-client = "*", libxkbcommon = "*", libxkbcommon-x11 = "*", libX11 = "*", libX11-xcb = "*", libXcursor = "*", libXi = "*", libglvnd-egl = "*", dbus-libs = "*", fontconfig = "*" }
recommends = { vulkan-loader = "*" }
assets = [
    { source = "target/release/tuzminal", dest = "/usr/bin/tuzminal", mode = "755" },
    { source = "assets/tuzminal.desktop", dest = "/usr/share/applications/tuzminal.desktop", mode = "644" },
    { source = "assets/tuzminal.svg", dest = "/usr/share/icons/hicolor/scalable/apps/tuzminal.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/tuzminal/README.md", mode = "644", doc = true },
    { source = "docs/PLUGINS.md", dest = "/usr/share/doc/tuzminal/PLUGINS.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/tuzminal/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/tuzminal/LICENSE-APACHE", mode = "644", doc = true },
]

[dependencies]
tuz-config.workspace = true
tuz-core.workspace = true
tuz-font.workspace = true
tuz-input.workspace = true
tuz-layout.workspace = true
tuz-plugin.workspace = true
tuz-plugin-api.workspace = true
tuz-render.workspace = true
tuz-ui.workspace = true

alacritty_terminal.workspace = true
arboard.workspace = true
rfd.workspace = true
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true

anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
toml.workspace = true
tuz-core = { workspace = true, features = ["test-util"] }
