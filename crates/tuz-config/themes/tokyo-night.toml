name = "tokyo-night"

# Adapted from Tokyo Night (github.com/enkia/tokyo-night-vscode-theme).

background = "#1a1b26"
foreground = "#c0caf5"

cursor = "#c0caf5"
cursor_text = "#1a1b26"

selection_background = "#33467c"
selection_foreground = "#c0caf5"

# The focused pane lifts slightly from the rest, and the divider recedes.
background_focused = "#24283b"
split_divider = "#3b4261"

[normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"
