name = "one-dark"

# Adapted from One Dark (Atom's default dark theme).

background = "#282c34"
foreground = "#abb2bf"

cursor = "#528bff"
cursor_text = "#282c34"

selection_background = "#3e4451"
selection_foreground = "#abb2bf"

# The focused pane lifts slightly from the rest, and the divider recedes.
background_focused = "#2f343f"
split_divider = "#3e4451"

[normal]
black   = "#282c34"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#abb2bf"

[bright]
black   = "#5c6370"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#ffffff"
