name = "gruvbox-dark"

# Adapted from gruvbox (github.com/morhetz/gruvbox), dark medium background.

background = "#282828"
foreground = "#ebdbb2"

cursor = "#ebdbb2"
cursor_text = "#282828"

selection_background = "#504945"
selection_foreground = "#ebdbb2"

# The focused pane lifts slightly from the rest, and the divider recedes.
background_focused = "#32302f"
split_divider = "#504945"

[normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"
