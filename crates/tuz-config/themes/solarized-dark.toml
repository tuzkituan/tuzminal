name = "solarized-dark"

# Adapted from Solarized (ethanschoonover.com/solarized), dark variant.
# base03 background, base0 text.

background = "#002b36"
foreground = "#839496"

cursor = "#93a1a1"
cursor_text = "#002b36"

selection_background = "#073642"
selection_foreground = "#93a1a1"

# The focused pane lifts slightly from the rest, and the divider recedes.
background_focused = "#073642"
split_divider = "#586e75"

[normal]
black   = "#073642"
red     = "#dc322f"
green   = "#859900"
yellow  = "#b58900"
blue    = "#268bd2"
magenta = "#d33682"
cyan    = "#2aa198"
white   = "#eee8d5"

[bright]
black   = "#586e75"
red     = "#cb4b16"
green   = "#586e75"
yellow  = "#657b83"
blue    = "#839496"
magenta = "#6c71c4"
cyan    = "#93a1a1"
white   = "#fdf6e3"
