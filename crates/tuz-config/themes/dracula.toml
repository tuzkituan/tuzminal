name = "dracula"

# Adapted from the Dracula palette (draculatheme.com). The ANSI sixteen are the
# project's own terminal mapping; the chrome colors are derived from its
# background and current-line values.

background = "#282a36"
foreground = "#f8f8f2"

cursor = "#f8f8f2"
cursor_text = "#282a36"

selection_background = "#44475a"
selection_foreground = "#f8f8f2"

# The focused pane lifts slightly from the rest, and the divider recedes.
background_focused = "#343746"
split_divider = "#44475a"

[normal]
black   = "#21222c"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#bd93f9"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#f8f8f2"

[bright]
black   = "#6272a4"
red     = "#ff6e6e"
green   = "#69ff94"
yellow  = "#ffffa5"
blue    = "#d6acff"
magenta = "#ff92df"
cyan    = "#a4ffff"
white   = "#ffffff"
