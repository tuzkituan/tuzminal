name = "tuz-light"

# Warm paper rather than #ffffff. A pure-white terminal is the brightest thing on the
# screen and reads as glare next to everything around it; pulling the background a few
# points off white keeps the contrast with the text without the sheet-of-paper effect.
background = "#f4f2ed"
foreground = "#3b3f4a"

cursor = "#4078f2"
cursor_text = "#f4f2ed"

selection_background = "#d5dae6"
selection_foreground = "#3b3f4a"

# The focused pane lifts slightly rather than going white, so the difference is
# visible without either surface becoming the bright spot in the room.
background_focused = "#fbfaf7"
split_divider = "#dcd7cd"

[normal]
black   = "#3b3f4a"
red     = "#d64a3f"
green   = "#4a9349"
yellow  = "#b07701"
blue    = "#3a6fe0"
magenta = "#9a23a0"
cyan    = "#0178ad"
white   = "#f4f2ed"

[bright]
black   = "#6b6f7d"
red     = "#e46255"
green   = "#5da85c"
yellow  = "#c78f18"
blue    = "#5484ee"
magenta = "#ae3fac"
cyan    = "#178cc2"
white   = "#fbfaf7"
